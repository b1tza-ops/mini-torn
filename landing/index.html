<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="The Smoke — a persistent browser RPG set across London. Coming soon.">
  <title>The Smoke — Own London</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fog fog-one"></div>
  <div class="fog fog-two"></div>

  <main class="hero">
    <div class="eyebrow">LONDON // DEVELOPMENT BUILD</div>

    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 180 180" role="img">
        <path class="smoke-line" d="M118 20C82 30 69 52 91 73c18 17 14 31-8 42-23 11-33 29-20 47 9 12 28 16 48 7"/>
        <path class="smoke-line thin" d="M132 38c-22 10-27 23-12 37 14 13 11 25-6 34"/>
        <path class="skyline" d="M34 139h112M49 139v-29h11v29m10 0V97h13v42m11 0v-53h14v53m10 0v-35h12v35"/>
      </svg>
    </div>

    <h1><span>THE</span> SMOKE</h1>
    <p class="tagline">OWN LONDON.</p>

    <p class="intro">
      A persistent browser RPG set across the capital. Build your name, choose your path,
      survive the streets and shape your place in the city.
    </p>

    <div class="status">
      <span class="pulse"></span>
      <span>Currently in development</span>
    </div>

    <div class="districts" aria-label="Planned London districts">
      <span>CAMDEN</span>
      <span>BRIXTON</span>
      <span>SOHO</span>
      <span>THE CITY</span>
      <span>CANARY WHARF</span>
    </div>
  </main>

  <footer>
    <span>the-smoke.com</span>
    <span>© 2026 The Smoke</span>
  </footer>
</body>
</html>
