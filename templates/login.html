<!DOCTYPE html>
<html>
<head>
    <title>The Smoke - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="card">

    <h1>THE SMOKE</h1>
    <p class="subtitle">London never sleeps.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Enter The Smoke
        </button>

    </form>

</div>

</body>
</html>
